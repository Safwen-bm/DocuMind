name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Build + Test + Coverage + Security ──────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: saas_docs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/saas_docs_test
      JWT_SECRET: ci_test_jwt_secret_not_real
      FRONTEND_URL: http://localhost:3001
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USER: test@example.com
      MAIL_PASS: fake_pass
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      GEMINI_API_KEY: fake_gemini_key
      CLOUDINARY_CLOUD_NAME: fake
      CLOUDINARY_API_KEY: fake
      CLOUDINARY_API_SECRET: fake

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy

      - name: Lint (non-blocking)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Unit tests + coverage
        run: npm run test:cov -- --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests
        env:
        NODE_ENV: test

      - name: Security audit
        run: npm audit --audit-level=high || true

  # ─── Frontend: Build + Security ───────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high || true
